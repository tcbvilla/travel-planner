server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: game-attendance-backend
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/game_attendance?user=postgres&password=postgres&sslmode=disable&authenticationPlugin=org.postgresql.plugin.authentication.cleartext.PasswordAuthenticator
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # Liquibase 配置
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: prod
    drop-first: false

# 日志配置
logging:
  level:
    root: INFO
    com.tripmaster: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 100MB
    max-history: 30

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 100MB

# JWT配置
jwt:
  secret: your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-production-use
  expiration: 86400000  # 24小时，单位毫秒

# 应用配置
app:
  upload:
    # 团徽上传目录，生产环境建议使用绝对路径
    # Windows 示例：C:/uploads/team_logos 或 ${user.home}/uploads/team_logos
    # Linux 示例：/var/www/uploads/team_logos 或 /home/app/uploads/team_logos
    team-logos-dir: ${user.home}/uploads/team_logos

# 应用信息
info:
  app:
    name: ${spring.application.name}
    version: @project.version@
    description: 游戏考勤统计系统后端服务
