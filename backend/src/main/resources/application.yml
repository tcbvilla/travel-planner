server:
  port: 8080
spring:
  application:
    name: game-attendance-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/game_attendance
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres 
  jpa:
    hibernate:
      ddl-auto: validate  # 改为validate，由Liquibase管理数据库结构
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: default
    drop-first: false  # 生产环境禁用drop-first

# JWT配置
jwt:
  secret: mySecretKeyForJWTTokenGeneration123456789MySecretKeyForJWTTokenGeneration123456789
  expiration: 86400  # 24小时，单位：秒
